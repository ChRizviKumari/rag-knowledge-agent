[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-agent"
version = "0.1.0"
description = "Retrieval-augmented generation from scratch: BM25 + TF-IDF + RRF hybrid retrieval, citations, evaluation, Flask API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chintada Rizvi Kumari" }]
dependencies = ["numpy>=1.26", "flask>=3.0", "pydantic>=2.5"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
dev = ["pytest>=8.0"]

[project.scripts]
rag-agent = "rag_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
